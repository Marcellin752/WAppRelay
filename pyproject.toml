[project]
name = "wapprelay"
version = "0.1.0"
description = "WAppRelay - service de relai de messages WhatsApp"
readme = "README.md"
authors = [
    { name = "Marcellin Sambieni", email = "marcellin.sambieni@epitech.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
